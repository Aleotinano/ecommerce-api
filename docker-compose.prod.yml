# Compose de PRODUCCIÓN. Pensado para una máquina propia expuesta con **Tailscale
# Funnel** (ver docs/DEPLOY.md).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# NO es un override de docker-compose.yml, y no puede serlo: compose MERGEA las
# listas `ports:`, así que un archivo de override no tiene forma de despublicar un
# puerto que el archivo base publica. Y despublicar `postgres` y `redis` es
# justamente lo que cambia acá — el compose de dev los expone en 0.0.0.0 con
# credenciales de dev y sin password en Redis, que en una máquina de desarrollo es
# tolerable y en algo alcanzable desde afuera es una RCE servida.
#
# No hay reverse proxy propio: Funnel termina el TLS afuera y entrega el tráfico a
# un puerto del HOST, no a la red de compose. Por eso `backend` sí publica —
# atado a loopback, ver su comentario. Antes acá vivía un servicio `caddy` que
# sacaba certificados de Let's Encrypt para un dominio propio; con Funnel no hace
# falta ni dominio ni ACME.
#
# Todos los valores salen de `.env`, que en el server tiene los valores de
# producción (mismo archivo que consume `env_file`, así que hay una sola fuente).

name: ecommerce

x-logging: &logging
  # Sin esto los logs de json-file crecen sin techo y llenan el disco.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    # Sin `ports:` a propósito: la DB se habla sólo por la red interna de compose.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logging

  redis:
    image: redis:7-alpine
    # `--requirepass` es la segunda cerradura: tampoco publica puerto, pero si
    # algún día alguien agrega un `ports:` sin pensarlo, un Redis abierto es RCE
    # directa (CONFIG SET dir + escritura de authorized_keys).
    # La password va dentro de REDIS_URL, así que generala en hex
    # (`openssl rand -hex 24`): un `@` o un `/` rompen el parseo de la URL.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
    volumes:
      - redis_data:/data
    restart: always
    logging: *logging

  # One-shot para aplicar migraciones. Correr ANTES de cada `up -d` que traiga
  # migraciones nuevas:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
    depends_on:
      postgres:
        condition: service_healthy
    # La imagen no lleva gestor de paquetes (ver Dockerfile), así que se invoca
    # el shim de Prisma directo en vez de `pnpm exec` / `npx`.
    entrypoint: ["node_modules/.bin/prisma", "migrate", "deploy"]
    profiles: ["tools"]
    restart: "no"

  backend:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Cuántos proxies hay adelante. Con Funnel es `tailscaled`, que entrega la
      # request al puerto local agregando X-Forwarded-For — o sea 1 salto. Está
      # sin confirmar contra el deploy real: verificalo mirando qué IP loguea
      # pino-http en el primer request que entre desde fuera de la tailnet. Si es
      # la IP real del visitante, este valor está bien; si es una interna de
      # Tailscale, hay que subirlo. Con el número mal, los cinco rate limiters de
      # middleware/rateLimit.js meten a TODOS en el mismo balde.
      # Ver app.js -> app.set("trust proxy") y docs/DEPLOY.md.
      TRUST_PROXY: "1"
    # Publicado, a diferencia de postgres y redis, porque Funnel corre en el HOST
    # y no ve la red de compose: sin esto `tailscale funnel 3001` no encuentra
    # nada escuchando y el síntoma es un 502 con el contenedor en `healthy`.
    #
    # El bind explícito a 127.0.0.1 es la mitad importante de la línea: publica
    # sólo en loopback, así que lo alcanza `tailscaled` y nadie más — ni la LAN
    # de casa ni la red del router. Un `"3001:3001"` pelado lo abriría a 0.0.0.0.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    logging: *logging

volumes:
  postgres_data:
  redis_data:
